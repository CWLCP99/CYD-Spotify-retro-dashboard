; Mini Spotify display for the ESP32-2432S028R ("Cheap Yellow Display")
;
; Two environments:
;   cyd      -> the common version with ONE micro-USB port (ILI9341 display)
;   cyd2usb  -> the version with TWO USB ports (micro-USB + USB-C); same pins,
;               but the panel needs colour inversion
; Pick one in the PlatformIO toolbar (or: pio run -e cyd -t upload)

[platformio]
default_envs = cyd

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; WiFi + TLS + JPEG decoding don't fit in the default 1.2 MB app partition
board_build.partitions = huge_app.csv
lib_ldf_mode = chain
lib_deps =
    FS
    LittleFS
    SPIFFS
    SD
    bodmer/TFT_eSPI@^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    bodmer/TJpg_Decoder@^1.1.0
    bblanchon/ArduinoJson@^7.2.0

build_flags =
    ; ---- TFT_eSPI configuration (replaces editing User_Setup.h) ----
    -DUSER_SETUP_LOADED
    -DILI9341_2_DRIVER
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DUSE_HSPI_PORT
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DLOAD_GFXFF
    -DSMOOTH_FONT

[env:cyd]

[env:cyd2usb]
build_flags =
    ${env.build_flags}
    -DCYD_INVERT_COLORS
